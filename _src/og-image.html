<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Social preview source</title>
  <meta name="robots" content="noindex">
  <style>
    /* Source for assets/og-image.png (1200 x 630). See README for the rebuild command. */
    @font-face {
      font-family: "Inter";
      font-weight: 400 700;
      src: url("../assets/fonts/inter-latin.woff2") format("woff2");
    }

    @font-face {
      font-family: "Instrument Serif";
      font-style: italic;
      src: url("../assets/fonts/instrument-serif-italic-latin.woff2") format("woff2");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #050b17;
    }

    body {
      position: relative;
      isolation: isolate;
      color: #f4f7fb;
      font-family: "Inter", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .aurora {
      position: absolute;
      inset: -25% -15%;
      z-index: -1;
      background:
        radial-gradient(34% 40% at 22% 30%, rgba(13, 148, 136, 0.42), transparent 70%),
        radial-gradient(32% 38% at 78% 16%, rgba(37, 99, 235, 0.38), transparent 70%),
        radial-gradient(26% 34% at 58% 56%, rgba(99, 102, 241, 0.2), transparent 72%);
    }

    .gridlines {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-position: center top;
      background-size: 72px 72px;
      -webkit-mask-image: radial-gradient(ellipse 75% 60% at 50% 0%, #000 25%, transparent 75%);
      mask-image: radial-gradient(ellipse 75% 60% at 50% 0%, #000 25%, transparent 75%);
    }

    .top {
      position: absolute;
      top: 60px;
      left: 72px;
      right: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chips {
      display: flex;
      gap: 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: #b4c0d0;
      font-size: 20px;
      font-weight: 500;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #5eead4;
      box-shadow: 0 0 12px rgba(94, 234, 212, 0.8);
    }

    .url {
      color: #8393a8;
      font-size: 20px;
      font-weight: 500;
    }

    h1 {
      position: absolute;
      top: 166px;
      left: 68px;
      margin: 0;
      color: #fff;
      font-size: 88px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.045em;
    }

    p {
      position: absolute;
      top: 282px;
      left: 72px;
      margin: 0;
      color: #9fb0c8;
      font-size: 42px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    em {
      padding-right: 0.08em;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.1em;
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.005em;
      background-image: linear-gradient(95deg, #5eead4 0%, #7dd3fc 52%, #a5b4fc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .chart {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 40px;
      height: 170px;
    }

    .hc-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
    }

    .hc-grid line {
      stroke: rgba(255, 255, 255, 0.07);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .hc-obs path,
    .hc-line {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .hc-obs path {
      stroke: #7b8ba3;
    }

    .hc-line {
      stroke: #0d9488;
      filter: drop-shadow(0 0 6px rgba(13, 148, 136, 0.9));
    }

    .hc-now {
      stroke: rgba(255, 255, 255, 0.24);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .hc-dot {
      position: absolute;
      left: 62.5%;
      top: 54.7%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: #0d9488;
      box-shadow: 0 0 0 3px #050b17, 0 0 0 5px rgba(94, 234, 212, 0.7), 0 0 22px 4px rgba(13, 148, 136, 0.85);
    }
  </style>
</head>

  <div class="gridlines"></div>

    <div class="chips">
      <span class="chip"><span class="dot"></span>Data Scientist at UCSF Health</span>
      <span class="chip">PhD · Virginia Tech</span>
    </div>
    <span class="url">ebrahimvandi.com</span>
  </div>
